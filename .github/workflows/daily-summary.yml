name: Daily Horizon Summary

on:
  schedule:
    # GitHub scheduled workflows use UTC. 20:00 UTC is 04:00 Asia/Shanghai;
    # this intentionally runs early to offset the observed schedule delay.
    - cron: '0 23 * * *'
  workflow_dispatch:      # Allow manual trigger

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to commit changes

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"

      - name: Install dependencies
        run: uv sync

      - name: Prepare GitHub Actions config
        run: cp data/config.github.json data/config.json

      - name: Run Horizon
        env:
          # Map secrets to environment variables expected by config.json
          # Modify these based on your data/config.github.json provider settings
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          LWN_KEY: ${{ secrets.LWN_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          HORIZON_WEBHOOK_URL: ${{ secrets.HORIZON_WEBHOOK_URL }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: uv run horizon --hours 24

      - name: Send report to DingTalk (optional)
        if: success()
        env:
          DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          REPORT_FILE="data/summaries/horizon-${TODAY}-zh.md"
          if [ ! -f "$REPORT_FILE" ]; then
            REPORT_FILE="data/summaries/horizon-${TODAY}-en.md"
          fi
          if [ ! -f "$REPORT_FILE" ]; then
            echo "No summary file found, skipping DingTalk notification"
            exit 0
          fi
          REPORT=$(cat "$REPORT_FILE")
          SIGNED_URL=$(uv run python -c "
          import os, sys, json, time, hmac, hashlib, base64
          from urllib.parse import urlsplit, urlunsplit, urlencode, parse_qsl

          url = os.environ['DINGTALK_WEBHOOK_URL']
          secret = os.environ.get('DINGTALK_SECRET', '')
          if secret:
              timestamp = str(int(time.time() * 1000))
              string_to_sign = f'{timestamp}\n{secret}'
              hmac_code = hmac.new(
                  secret.encode('utf-8'),
                  string_to_sign.encode('utf-8'),
                  digestmod=hashlib.sha256
              ).digest()
              sign = base64.b64encode(hmac_code).decode('utf-8')
              parsed = urlsplit(url)
              query_params = dict(parse_qsl(parsed.query)) if parsed.query else {}
              query_params['timestamp'] = timestamp
              query_params['sign'] = sign
              new_query = urlencode(query_params)
              url = urlunsplit((parsed.scheme, parsed.netloc, parsed.path, new_query, parsed.fragment))
          print(url)
          ")
          PAYLOAD=$(python3 -c "
          import json, sys
          report = sys.stdin.read()
          if len(report) > 18000:
              report = report[:18000] + '\n\n...(内容过长已截断)'
          print(json.dumps({'msgtype': 'markdown', 'markdown': {'title': 'Horizon Daily', 'text': report}}, ensure_ascii=False))
          " <<< "$REPORT")
          curl -s -X POST "$SIGNED_URL" \
            -H 'Content-Type: application/json' \
            -d "$PAYLOAD"